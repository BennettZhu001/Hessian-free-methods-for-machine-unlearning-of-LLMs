[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer-unlearning"
version = "0.1.0"
description = "Hessian-free approximate unlearning on a tiny causal transformer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bennett (Ben) Zhu"}]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
